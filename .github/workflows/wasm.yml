name: WebAssembly
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  wasm:
    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release", "Debug"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install emscripten tools
        run: |
          cd ~
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential curl zip lz4

          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

          vcpkg integrate install

      - name: Cache Emscripten ports
        uses: actions/cache@v4
        with:
          path: ~/emsdk/upstream/emscripten/cache
          key: emscripten-cache-${{ runner.os }}-v1

      - name: Use cached vcpkg dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: wasm-dependencies-${{ hashFiles('vcpkg.json') }}

      - name: Configure build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          CXXFLAGS: "-include exception"
        run: |
          source ~/emsdk/emsdk_env.sh
          mkdir -p build
          cd build

          VCPKG_LIB_DIR="${{ github.workspace }}/vcpkg_installed/wasm32-emscripten/lib"

          if [ "$BUILD_TYPE" = "Release" ]; then
            OPT_FLAGS="-O3 -flto"
            LINK_OPT_FLAGS="-O3 -flto -sLZ4=1 -sASSERTIONS=0"
          else
            OPT_FLAGS="-O0 -g"
            LINK_OPT_FLAGS="-O0 -g -sASSERTIONS=2 -sSAFE_HEAP=1"
          fi

          # Explicitly link vcpkg's libSDL3_image.a (and image codecs) so IMG_Load_IO is never dropped
          SDL3_IMG_LINK="-L${VCPKG_LIB_DIR} -lSDL3_image -lpng16 -ljpeg -lspng -lz"
          MEM_FLAGS="-sINITIAL_MEMORY=134217728 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 -lidbfs.js"

          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DWARNINGS=ON \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=~/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DVCPKG_MANIFEST_FEATURES=core \
            -DCMAKE_C_FLAGS_INIT="${OPT_FLAGS}" \
            -DCMAKE_CXX_FLAGS_INIT="-include exception ${OPT_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="${LINK_OPT_FLAGS} ${SDL3_IMG_LINK} ${MEM_FLAGS}"

      - name: Sync data folder
        working-directory: build
        run: |
          rsync -aP ../data/ data/

      - name: Build
        working-directory: build
        run: |
          source ~/emsdk/emsdk_env.sh
          emmake make -j$(nproc)

      - name: Setup files for upload
        working-directory: build
        run: |
          cp template.html index.html
          mkdir -p upload/
          cp index.html supertux2* upload/

      - uses: actions/upload-artifact@v4
        if: matrix.build_type != 'Debug'
        with:
          name: "wasm32-emscripten-${{ matrix.build_type }}-html"
          path: build/upload/*
          if-no-files-found: ignore

      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/master' && matrix.build_type == 'Release' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/upload

  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
