name: WebAssembly
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request: {}

jobs:
  wasm:
    strategy:
      fail-fast: false
      matrix:
        build_type: ["Release", "Debug"]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install emscripten tools
        run: |
          cd ~
          sudo apt-get update
          # Added liblz4-tool / lz4 for -sLZ4=1 data packaging
          sudo apt-get install -y git cmake build-essential curl zip lz4

          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

          vcpkg integrate install

      - name: Cache Emscripten ports
        uses: actions/cache@v4
        with:
          path: ~/emsdk/upstream/emscripten/cache
          key: emscripten-cache-${{ hashFiles('.github/workflows/wasm.yml') }}

      - name: Use cached vcpkg dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: wasm-dependencies-${{ hashFiles('.github/workflows/wasm.yml', 'vcpkg.json') }}

      - name: Configure build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          # Seeding CXXFLAGS here ensures CMake never drops -include exception
          CXXFLAGS: "-include exception"
        run: |
          source ~/emsdk/emsdk_env.sh
          mkdir -p build
          cd build

          if [ "$BUILD_TYPE" = "Release" ]; then
            OPT_FLAGS="-O3 -flto"
            LINK_OPT_FLAGS="-O3 -flto -sLZ4=1 -sASSERTIONS=0"
          else
            OPT_FLAGS="-O0 -g"
            LINK_OPT_FLAGS="-O0 -g -sASSERTIONS=2 -sSAFE_HEAP=1"
          fi

          SDL_PORTS="-sUSE_SDL=3 -sUSE_SDL_IMAGE=3 -sUSE_SDL_TTF=3 -sSDL2_IMAGE_FORMATS='[\"png\",\"jpg\"]'"
          MEM_FLAGS="-sINITIAL_MEMORY=134217728 -sALLOW_MEMORY_GROWTH=1 -sFORCE_FILESYSTEM=1 -lidbfs.js -sERROR_ON_UNDEFINED_SYMBOLS=1"

          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DWARNINGS=ON \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=~/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DVCPKG_MANIFEST_FEATURES=core \
            -DCMAKE_C_FLAGS_INIT="${OPT_FLAGS} ${SDL_PORTS}" \
            -DCMAKE_CXX_FLAGS_INIT="-include exception ${OPT_FLAGS} ${SDL_PORTS}" \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="${LINK_OPT_FLAGS} ${SDL_PORTS} ${MEM_FLAGS}"

      - name: Sync data folder
        working-directory: build
        run: |
          rsync -aP ../data/ data/

      - name: Build
        working-directory: build
        run: |
          source ~/emsdk/emsdk_env.sh
          emmake make -j$(nproc)

      - name: Setup files for upload
        working-directory: build
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          cp template.html supertux2.html
          mkdir -p upload/
          mv supertux2* upload/

      - uses: actions/upload-artifact@v4
        if: matrix.build_type != 'Debug'
        with:
          name: "wasm32-emscripten-${{ matrix.build_type }}-html"
          path: build/upload/*
          if-no-files-found: ignore

      - name: Upload to server
        if: ${{ github.ref == 'refs/heads/master' && matrix.build_type == 'Release' }}
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
        run: |
          cd build/upload/
          mv supertux2.html index.html
          zip supertux2.zip *
          curl -F "archive=@$(pwd)/supertux2.zip" -F "message=$(git log --format=%B -n 1 | head -1)" $UPLOAD_URL
